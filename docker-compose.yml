services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: sv
      POSTGRES_PASSWORD: sv
      POSTGRES_DB: securevault
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sv -d securevault"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: abe-runtime/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - backend/.env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
